# Local development stack: PostgreSQL + Redis + FastAPI backend + React frontend.
# Start everything with:  docker compose up --build
# Values like ${POSTGRES_PASSWORD} come from the .env file (copy .env.example to .env first).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trustauth}
    volumes:
      - pgdata:/var/lib/postgresql/data # keep data between restarts
    healthcheck:
      # Docker marks the database "healthy" once it accepts connections.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Short-lived data: login sessions, challenges, phone-approval tokens. Nothing permanent,
    # so no volume: a restart clears it (users just log in again).
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trustauth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trustauth}
      REDIS_URL: redis://redis:6379/0
      FACTOR_MODE: ${FACTOR_MODE:-mock} # mock | real (real factors where they exist, mocks for the rest)
      ADMIN_TOKEN: ${ADMIN_TOKEN:-} # researcher endpoints (/admin/...); empty = switched off
      LEAKED_PASSWORDS_PATH: /datasets/leaked-passwords/top-100000.txt # password factor (M3)
      WATCHFILES_FORCE_POLLING: "true" # make --reload notice edits made on Windows
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # live code: edits on your machine appear in the container
      - ./datasets:/datasets:ro # git-ignored datasets (leaked-password list), read-only
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep the container's own node_modules, not the host's
    depends_on:
      - backend

volumes:
  pgdata:
